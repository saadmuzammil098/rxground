name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-task-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: Schema and chunking tests
        # Fast, offline: only exercises schema validation and the two
        # chunking strategies against data/raw fixtures, no live openFDA
        # call, no embedding model download needed.
        run: python -m pytest tests -v

  test-task-2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: Retrieval math and RAG orchestration tests
        # Fast, offline: retrieve() and generate() are monkeypatched, no
        # live Chroma index, embedding model, Ollama server, or API keys
        # needed. Only the L2-to-cosine conversion and the citation/gate
        # logic are under test here.
        run: python -m pytest tests -v

  test-task-3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: Citation schema, groundedness, and citation cross-check tests
        # Fast, offline: no live Chroma index, embedding model, Ollama
        # server, or API keys needed. Only the Pydantic schema, the
        # lexical-overlap groundedness heuristic, JSON extraction, and the
        # chunk_id cross-check logic are under test here.
        run: python -m pytest tests -v

  test-task-4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: RRF fusion, query expansion, and scope guardrail tests
        # Fast, offline: no live Chroma index, embedding model, BM25
        # index, or reranker download needed. Only the pure RRF math,
        # the brand/generic query expansion logic, and the scope
        # guardrail's pattern matching are under test here.
        run: python -m pytest tests -v

  test-task-5:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: Prompt-building and golden-set structure tests
        # Fast, offline: generate_answers.py imports task-4's retrieval
        # chain (chromadb, rank_bm25 at module load time), so the full
        # requirements.txt is needed to import it at all, but these tests
        # exercise only the prompt builder and the golden set's own
        # structure, no live Chroma index, embedding model, Ollama
        # server, or ragas judge call is made.
        run: python -m pytest tests -v

  test-task-6:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install pytest
      - name: Ingestion manifest tests
        # Fast, offline: no Prefect, Chroma, embedding model, or live
        # openFDA data needed, manifest.py has no dependencies beyond the
        # standard library, only pytest itself needs installing.
        run: python -m pytest tests -v

  test-task-7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r ../requirements.txt
      - name: Query service tests
        # Fast, offline: answer_question is monkeypatched, no live Chroma
        # index, embedding model, Ollama server, or API keys needed. Only
        # the FastAPI request/response wiring is under test here.
        run: python -m pytest tests -v

  readme-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_mermaid.py
